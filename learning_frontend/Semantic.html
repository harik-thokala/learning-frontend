<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML example</title>
</head>
<body>

    <!--Top section of the page  -->
    <header>
        <h1>My blog</h1>

        <!-- Navigation links ,menu -->
        <nav>
            <a href="#home">My home</a>
            <a href="#articles">Articles</a>
            <a href="#contacts">Contacts</a>
        </nav>
    </header>

    <!--Main content of the document-->

    <main>
        <!-- Article - Self contained content-->
         <article>
            <header>
                <h2>What is Semantic HTMl</h2>
                <time datetime="04-09-2025">september 4 2025</time>
            </header>
            <p>Semantic HTML gives meaning to your webpage content...</p>
         </article>

         <!-- Section  theamatic grouping-->
          <section>
            <h3>Benefits</h3>
            <!-- UnOrdered list-->
            <ul>
                <li> Improves SEO</li>
                <li> Helps Screen readers</li>
                <li> Make code easeir to read</li>
            </ul>
          </section>
    </main>
    <!-- Aside Side infor-->
    <aside>
        <h3>Related posts</h3>
        <ul>
            <li><a href="#">HTML5 basics</a></li>
            <li><a href="#">CSS tips</a></li>
        </ul>
    </aside>

    <!--Footer  bottom section ,copy right,contact info-->
    <footer>
        <p>;&copy; 2025 my blogs</p>

    </footer>


</body>
</html>
