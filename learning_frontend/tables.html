<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Html tables examples</h1>

    <!-- simple table-->

    <table>
       <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
       </tr>
       <tr>
        <td>Harikrishna</td>
        <td>27</td>
        <td>Bangalore</td>
       </tr>
       <tr>
        <td>Ahalya</td>
        <td>24</td>
        <td>Hyderabad</td>
       </tr>
       

    </table>

    <!-- Table with Caption, Rowspan and Colspan-->

    <h2>Table with caption ,rowspan and colspan</h2>
    <table>
        <caption>Student marks</caption>
        <tr>
            <th rowspan="2">Names</th>
            <th colspan="3">subjects</th>
        </tr>
        <tr>
            <th>Maths</th>
            <th>Science</th>
            <th>physics</th>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>60</td>
            <td>80</td>
            <td>90</td>
        </tr>
        <tr>
            <td>priya</td>
            <td>78</td>
            <td>87</td>
            <td>50</td>
        </tr>
    </table>

    <!-- 3. Table with thead, tbody, tfoot -->
  <h2>3. Table with thead, tbody, tfoot</h2>
  <table>
    <thead>
      <tr>
        <th>Product</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Apples</td>
        <td>₹120</td>
      </tr>
      <tr>
        <td>Bananas</td>
        <td>₹80</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td>Total</td>
        <td>₹200</td>
      </tr>
    </tfoot>
  </table>

    
</body>
</html>
