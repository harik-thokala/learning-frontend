<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flexbox Examples</title>
  <style>
    body {
      margin: 20px;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }
    h2 {
      margin-top: 40px;
      color: #333;
    }

    /* 1. Flexbox Header (Navbar) */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #007BFF;
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
    }
    nav ul {
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;
      gap: 20px;
    }
    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    /* 2. Stats Section (Cards) */
    .stats {
      display: flex;
      justify-content: space-around;
      padding: 20px;
      gap: 20px;
    }
    .stat {
      flex: 1;
      background: #f2f2f2;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* 3. Sidebar + Content Layout */
    .container {
      display: flex;
      min-height: 200px;
      margin-top: 20px;
    }
    .sidebar {
      flex: 1;
      background: #f4f4f4;
      padding: 20px;
      border-right: 2px solid #ddd;
    }
    .content {
      flex: 3;
      background: #fff;
      padding: 20px;
    }

    /* 4. Centered Box */
    .center-box {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      background: lightblue;
      margin-top: 20px;
      border-radius: 8px;
    }
    .center-box div {
      padding: 20px 30px;
      background: navy;
      color: white;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Flexbox Examples</h1>

  <!-- 1. Header (Navbar) -->
  <h2>1. Flexbox Header (Navbar)</h2>
  <header>
    <h1>MySite</h1>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- 2. Stats Section -->
  <h2>2. Stats Section (Cards)</h2>
  <div class="stats">
    <div class="stat">
      <h2>150+</h2>
      <p>Projects</p>
    </div>
    <div class="stat">
      <h2>80+</h2>
      <p>Clients</p>
    </div>
    <div class="stat">
      <h2>10</h2>
      <p>Years</p>
    </div>
  </div>

  <!-- 3. Sidebar + Content -->
  <h2>3. Sidebar + Content Layout</h2>
  <div class="container">
    <div class="sidebar">Sidebar</div>
    <div class="content">Main Content Area</div>
  </div>

  <!-- 4. Centered Box -->
  <h2>4. Centered Item</h2>
  <div class="center-box">
    <div>Perfectly Centered!</div>
  </div>

</body>
</html>
