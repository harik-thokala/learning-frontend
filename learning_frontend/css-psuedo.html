<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pseudo-classes Example</title>
  <style>
    a {
      color: black;
      text-decoration: none;
      font-size: 18px;
      margin: 10px;
      display: inline-block;
    }
    a:hover {
      color: #007BFF; /* link hover */
      text-decoration: underline;
    }
    input {
      margin-top: 20px;
      padding: 10px;
      border: 2px solid gray;
      border-radius: 5px;
    }
    input:focus {
      border-color: green;
      outline: none;
      background: #f0fff0;
    }
  </style>
</head>
<body>
  <h1>Pseudo-classes Example</h1>
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Contact</a>

  <br><br>
  <input type="text" placeholder="Type something...">
</body>
</html>
